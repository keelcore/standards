name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every make target runs its tools in the dev image (containers/dev/Containerfile, via
# scripts/dev/run.sh and docker): no tool is installed on the runner.
# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:
  # The tool image for this tree's build context, published once (skipped when it is
  # already in GHCR); every tool job below pulls it instead of building it. Pull requests
  # do not publish: their tool jobs pull a published context or build it in the runner.
  dev-image:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/dev-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write

  audit:
    name: audit / makefile
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make audit
      - run: make check-clean-tree

  pr-policy:
    name: policy / pr
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: dev-image
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.dev-image.result != 'failure' }}
    env:
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: make check-pr-policy
      - run: make check-clean-tree

  check-governance:
    name: check / governance metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make check-adr-metadata
      - run: make check-governance-metadata
      - run: make check-rfc-metadata
      - run: make check-clean-tree

  lint-markdown:
    name: lint / markdown
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: make lint-newlines
      - run: make lint-markdown
      - run: make lint-adapters-local
      - run: make check-clean-tree

  lint-workflows:
    name: lint / workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: make lint-workflows

  lint-bash:
    name: lint / bash
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-bash
      - run: make check-clean-tree

  lint-gosec:
    name: lint / gosec
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-gosec
      - run: make check-clean-tree

  integration-test:
    name: test / bats
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make test-integration
      - run: make check-clean-tree

  verify-go:
    name: verify / go module
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: make verify-go
      - run: make lint-go
      - run: make check-clean-tree

