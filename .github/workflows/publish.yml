name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:
  publish-npm:
    name: publish / npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - run: make release-npm
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          KEELCORE_DEV_ENV: INPUT_TAG

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-package
          path: target/dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: publish / pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          fetch-tags: true

      - run: make release-pypi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: target/dist/

      - name: Attest PyPI provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "target/dist/*"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypi-package
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

  publish-go:
    name: publish / go (pkg.go.dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: go-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - run: make release-go
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          KEELCORE_DEV_ENV: INPUT_TAG

  # The GitHub Release, after every package is published: the published files, the Go
  # module zip, one SBOM per artifact, build-environment SBOMs of the pinned tool images,
  # current_pins.md, SHA256SUMS and a keyless cosign bundle per file; then every asset is
  # verified (checksums and signatures against this workflow's identity).
  github-release:
    name: release / github
    needs: [publish-npm, publish-pypi, publish-go]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          fetch-tags: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: "*-package"
          path: target/release
          merge-multiple: true

      - run: make release-assets

      - run: make release-github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: make release-verify-blobs
