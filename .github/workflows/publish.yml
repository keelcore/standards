name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:
  ci-passed:
    name: CI passed on this commit
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: make wait-for-ci
        env:
          GH_TOKEN: ${{ github.token }}

  publish-npm:
    needs: ci-passed
    name: publish / npm
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: make publish-npm
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
      - run: make wait-for-publish ARGS="npm"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}

  publish-pypi:
    needs: ci-passed
    name: publish / pypi
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true

      - run: make publish-pypi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: target/dist/
      - run: make wait-for-publish ARGS="pypi"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}

      - name: Attest PyPI provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "target/dist/*"

  publish-go:
    needs: ci-passed
    name: publish / go (pkg.go.dev)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: go-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: make publish-go
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
      - run: make wait-for-publish ARGS="go"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}

  # The GitHub Release, after every package is published (github-release.yml; rerunnable for
  # any tag by dispatching that workflow).
  github-release:
    name: release / github
    needs: [publish-npm, publish-pypi, publish-go]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
