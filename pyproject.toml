[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "keelcore-standards"
dynamic = ["version"]
description = "Engineering standards for keelcore projects — coding, CI, and bash."
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
include = ["governance/", "containers/dev/image.ref"]

[tool.hatch.build.targets.sdist]
include = ["governance/", "containers/dev/image.ref", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
