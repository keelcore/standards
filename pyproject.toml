[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "keelcore-standards"
dynamic = ["version"]
description = "Engineering standards for keelcore projects — coding, CI, and bash."
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.hatch.version]
source = "vcs"

# The wheel's data lives inside the distribution's own package, never at the top of site-packages: read it with
# importlib.resources.files("keelcore_standards") (a namespace package, so no Python source is shipped).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"governance" = "keelcore_standards/governance"
"containers/dev/image.ref" = "keelcore_standards/containers/dev/image.ref"

[tool.hatch.build.targets.sdist]
include = ["governance/", "containers/dev/image.ref", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
